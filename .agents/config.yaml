# ---------------------------------------------------------------------------
# Project-level config for the Anacleto source tree
# ---------------------------------------------------------------------------
# Merges on top of ~/.config/anacleto/config.yaml

models:
  openrouter:
    api_key: ${OPENROUTER_API_KEY}
    model: deepseek/deepseek-v4-flash
    context_window: 200000

mcps:
  codegraph:
    transport: stdio
    command: codegraph
    args: ["serve", "--mcp"]
