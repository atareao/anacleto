name: Publish

# Publica el crate en crates.io cuando se crea un tag de release.
#
# NOTA (gitflow): los tags de release deben llevar el prefijo `v` (p.ej. `v0.1.0`),
# aunque el tag actual del proyecto sea `0.1.0` sin prefijo. Se usa el patrón `v*`
# por ser la convención estándar de releases semver.
on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  publish:
    name: Publish to crates.io
    needs: check
    runs-on: ubuntu-latest
    # Solo lectura: el job de publicación no necesita escribir en el repo.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      # El árbol de trabajo debe estar limpio (sin cambios sin commitear) para
      # que `cargo publish` funcione sin `--allow-dirty`.
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
