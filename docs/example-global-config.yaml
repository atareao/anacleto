# ---------------------------------------------------------------------------
# Global agents
# ---------------------------------------------------------------------------
# Agents are NOT defined here. Each agent is a self-contained Markdown file
# with YAML frontmatter in the agents/ directory:
#
#   global:  ~/.config/anacleto/agents/*.md
#   project: .agents/agents/*.md
#
# The frontmatter holds the structural config (name, role, model, skills,
# mcps, permissions, subagents) and the Markdown body is the system prompt.
# Project agents override global agents with the same name. Exactly one agent
# must declare `role: root`.
#
# Example (.agents/agents/root.md):
#   ---
#   name: root
#   description: Senior engineering agent
#   role: root
#   model: deepseek/deepseek-v4-flash
#   skills:
#     - .agents/skills/shell/
#   subagents:
#     - reviewer
#   ---
#
#   You are **Anacleto**...

# ---------------------------------------------------------------------------
# Tool defaults
# ---------------------------------------------------------------------------
# Default values for built-in tools. Agents declare which tools they use in
# their frontmatter `tools:` section. These defaults are merged with any
# per-agent overrides.
#
# Fields:
#   description: Description sent to the LLM (overrides the hardcoded default)
#   show:        Whether executions are shown in the TUI chat (default: true)
#   display:     Display template with {param} placeholders (optional)
#   color:       Color for the tool execution line in the TUI (optional)
#
# If a tool is not listed here, the hardcoded Rust defaults are used.

tools:
  read:
    description: "Read files from the filesystem"
    show: true
    color: cyan
  grep:
    description: "Search file contents using regular expressions"
    show: true
    color: blue
  glob:
    description: "Find files matching a glob pattern"
    show: true
    color: blue
  bash:
    description: "Execute shell commands in the workspace"
    show: true
    color: green
    display: "$ {command}"
  webfetch:
    description: "Fetch content from a URL"
    show: true
    color: green
    display: "\U0001f310 {url}"
  websearch:
    description: "Search the web"
    show: true
    color: green
  todo:
    description: "Manage task list"
    show: true
    color: magenta
    display: "\U0001f4dd {action}"
  question:
    description: "Ask the user a question"
    show: true
    color: yellow
  task:
    description: "Delegate work to a subagent"
    show: true
    color: magenta
    display: "\u26a1 {description}"
  compress:
    description: "Compress conversation context"
    show: true
    color: yellow
  skill:
    description: "Load and execute a skill"
    show: true
    color: cyan
    display: "\U0001f3af {name}"
  apply_patch:
    description: "Apply a code patch"
    show: true
    color: green
  mcp_list_resources:
    description: "List MCP resources"
    show: false
    color: cyan
  mcp_read_resource:
    description: "Read an MCP resource"
    show: false
    color: cyan
  mcp_list_resource_templates:
    description: "List MCP resource templates"
    show: false
    color: cyan
  lsp_query:
    description: "Query the LSP"
    show: false
    color: cyan

# ---------------------------------------------------------------------------
# Keymap overrides
# ---------------------------------------------------------------------------
# Every TUI shortcut is rebindable. Map an action name to a list of key
# strings. Valid modifiers: ctrl, alt, shift (comma-separated with '+').
# Valid keys: a-z, 0-9, enter, escape/esc, tab, space, backspace, delete/del,
# insert/ins, home, end, left, right, up, down, pageup/pgup, pagedown/pgdn,
# f1..f12.
#
# Action names (snake_case or CamelCase):
#   Global: send, cancel_input, quit, toggle_sidebar, toggle_diff_viewer,
#     open_which_key, open_model_picker, open_editor, open_prompt_queue,
#     clear_input, approve, deny, focus_input, focus_sidebar, focus_chat,
#     focus_mcps, focus_skills, focus_agents, quick_slot1..9
#   Input editing: cursor_left, cursor_right, cursor_word_left,
#     cursor_word_right, cursor_home, cursor_end, delete_char,
#     delete_char_before, delete_word_before, delete_to_start, delete_to_end,
#     history_up, history_down, tab_complete, insert_newline
#   Chat: scroll_up, scroll_down, page_up, page_down, chat_top, chat_bottom
#   Lists (MCPs/Skills/Agents): list_up, list_down, list_top, list_bottom
#
# Unlisted actions keep their defaults. Example:
#
# keymap:
#   bindings:
#     quit: ["ctrl+q"]
#     cursor_word_left: ["ctrl+left", "alt+left"]
#     send: ["enter"]

# ---------------------------------------------------------------------------
# Hooks (shell commands that fire at lifecycle points)
# ---------------------------------------------------------------------------
# Each hook has a `type` (currently only `shell`) and a `command` string.
# Template variables ({{tool_name}}, {{file_path}}, {{shell_command}},
# {{agent_name}}) are substituted before execution.
#
# Example — sync codegraph after every apply_patch:
#
# hooks:
#   after_apply:
#     - type: shell
#       command: "codegraph sync"
#       timeout_secs: 60
#   on_startup:
#     - type: shell
#       command: "echo 'Engine started'"
